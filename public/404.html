<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lumenova</title>
    <script>
      // Single Page Apps for GitHub Pages: redirects the deep-link path
      // into a query string that index.html decodes back on load, so
      // client-side routes (e.g. /app/urine) survive a hard refresh.
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // keep the "/LUMENOVA" base segment
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
