name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/lumenova-health-screening-y1p0zx, ccr-2cb60886-yhjnpd]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Gubbi's site, published alongside Lumenova at /LUMENOVA/for-gubbi/
      - run: npm ci
        working-directory: our-little-universe
      - run: npm run build
        working-directory: our-little-universe
      - run: cp -r our-little-universe/dist dist/for-gubbi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
